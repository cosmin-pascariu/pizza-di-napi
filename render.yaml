# Render Blueprint: https://render.com/docs/blueprint-spec
# Deploys Pizza di Napi as a single web service on Render's free plan.
services:
  - type: web
    name: pizza-di-napi
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "24"
      # PayPal sandbox app: https://developer.paypal.com/dashboard/applications/sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: NEXT_PUBLIC_PAYPAL_CLIENT_ID
        sync: false
      # Gemini (free tier): https://aistudio.google.com/apikey
      - key: GOOGLE_GENERATIVE_AI_API_KEY
        sync: false
      # Kitchen dashboard PIN (8+ characters)
      - key: ADMIN_PIN
        sync: false
      - key: ADMIN_SESSION_SECRET
        generateValue: true
